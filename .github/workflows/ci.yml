name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # stated floor (mix.exs: elixir ~> 1.18) — compile + test only
          - elixir: '1.18.4'
            otp: '27.3'
            check_format: false
          # primary toolchain — the formatter check runs here only (formatter output differs across Elixir versions)
          - elixir: '1.19.5'
            otp: '28.0'
            check_format: true

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Core deps
        run: mix deps.get

      - name: Core format
        if: matrix.check_format
        run: mix format --check-formatted

      - name: Core compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Core test
        run: mix test

      - name: Extras deps
        run: cd extras/dspy_extras && mix deps.get

      - name: Extras format
        if: matrix.check_format
        run: cd extras/dspy_extras && mix format --check-formatted

      - name: Extras compile (warnings as errors)
        run: cd extras/dspy_extras && mix compile --warnings-as-errors

      - name: Extras test
        run: cd extras/dspy_extras && mix test
